# Every push to main and every pull request: the window's pages (typecheck and
# build), its bindings up to date, then vet and tests (macOS: the app needs cgo)
# and vet for Windows; the inbox's typecheck and tests, the page's check and build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: The window
        run: cd frontend && bun install --frozen-lockfile && bun run build
      - name: Its bindings are up to date
        run: scripts/bindings.sh && git diff --exit-code -- frontend/bindings
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test ./...
      - name: The inbox
        run: cd inbox && bun install --frozen-lockfile && bun run check
      - name: The page
        run: cd site && bun install --frozen-lockfile && bun run check
