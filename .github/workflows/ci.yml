# Every push to main and every pull request: the window's pages (typecheck and
# build), its bindings up to date, then vet and tests (macOS: the app needs cgo)
# and vet for Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - name: The window
        run: cd frontend && bun install --frozen-lockfile && bun run build
      - name: Its bindings are up to date
        run: scripts/bindings.sh && git diff --exit-code -- frontend/bindings
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test ./...
