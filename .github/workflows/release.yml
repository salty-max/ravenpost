# Pushing a tag vX.Y.Z (scripts/release.sh does it) publishes a release: the
# macOS universal .app and the Windows x64/arm64 .exe, with the tag's message
# as its notes. WoWLocker's and Hearthtale's download pages link to the latest.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # (no token left in git's config for the build to read: the repository is public)
          persist-credentials: false
          fetch-depth: 0
      # checkout leaves the tag lightweight: fetch it again for its message.
      - run: git fetch --force --tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Build
        env:
          INBOX_URL: ${{ vars.INBOX_URL }} # Ravenpost's inbox (inbox/README.md)
        run: scripts/build.sh
      # (the token for this step alone, never the build's; a rerun after a
      # half-done upload replaces the files instead of failing on the release)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN PGP SIGNATURE-----/,$d' > notes.md
          [ -s notes.md ] || { echo "::error::tag $TAG has no message (release notes)"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --draft=false
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md dist/*
          fi
