# Pushing a tag vX.Y.Z (scripts/release.sh does it) publishes a release: the
# macOS universal .app and the Windows x64/arm64 .exe, with the tag's message
# as its notes. WoWLocker's and Hearthtale's download pages link to the latest.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # checkout leaves the tag lightweight: fetch it again for its message.
      - run: git fetch --force --tags
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: scripts/build.sh
      - name: Publish the release
        run: |
          git tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN PGP SIGNATURE-----/,$d' > notes.md
          [ -s notes.md ] || { echo "::error::tag $TAG has no message (release notes)"; exit 1; }
          gh release create "$TAG" --title "$TAG" --notes-file notes.md dist/*
